<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 28 400 74" role="img" aria-label="A laser">
  <!-- The Labs and Study banners' little laser: a navy body (the logo's
       #304a6b, darker #22344c), its red beam (the site's #d40000) fading out. -->
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d40000"/>
      <stop offset="1" stop-color="#d40000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d40000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d40000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- feet -->
  <rect x="44" y="84" width="14" height="14" rx="2" fill="#22344c"/>
  <rect x="160" y="84" width="14" height="14" rx="2" fill="#22344c"/>
  <!-- body, with cooling fins on top -->
  <rect x="24" y="40" width="190" height="46" rx="7" fill="#304a6b"/>
  <g fill="#22344c">
    <rect x="40" y="32" width="6" height="10" rx="1"/>
    <rect x="52" y="32" width="6" height="10" rx="1"/>
    <rect x="64" y="32" width="6" height="10" rx="1"/>
    <rect x="76" y="32" width="6" height="10" rx="1"/>
  </g>
  <!-- a light stripe along the body and the power light -->
  <rect x="96" y="50" width="96" height="4" rx="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="44" cy="63" r="5" fill="#d40000"/>
  <!-- the nose where the beam leaves -->
  <rect x="214" y="52" width="22" height="22" rx="3" fill="#22344c"/>
  <!-- the beam -->
  <circle cx="240" cy="63" r="16" fill="url(#glow)"/>
  <rect x="236" y="61" width="184" height="4" fill="url(#beam)"/>
  <circle cx="238" cy="63" r="3.5" fill="#d40000"/>
</svg>
