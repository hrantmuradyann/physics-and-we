<!--
  ══════════════════════════════════════════════════════════════════════════
  THE LASER LAB — layout only.                          ?view=laser

  The words are NOT here. They are in  data/laser.json .

  The pictures are drawn by the scripts in js/laser/:
  page.js builds the page, js/laser/ui/ draws, js/laser/engine/ is the
  physics. The lab is built in stages: docs/laser-plan.md.

  This page is not in the menu. The banner on the Labs page leads here
  (sections/labs.html).

  THE BLOCKS OF THE STAGE (css/laser.css places them; on a narrow screen
  they stand one under another, in the order written here):
    more      the button that leads to the theory at the bottom of the page
    bench     the drawing of the laser, each mirror's shape and radius
              beside it, and the row right under it:
              Fire (on a laser with a flashlamp) and the Q-switch's
              On/Off (the bleachable filter, on a laser that can have it)
    controls  the choice of laser (two dropdowns), the sliders, each with
              a box to type a number in, and the buttons
    side      the chart of the output power, the mirrors' stability
              diagram, and the numbers
    photons   the cartoon of atoms and photons inside the medium, and
              under it the energy levels of one atom of that medium
  ══════════════════════════════════════════════════════════════════════════
-->

<!-- One plain neutral colour behind the whole page (no lines, no glow),
     so the laser light's own colour shows — see .laser-lab in css/laser.css -->
<div class="laser-lab">

<!-- ░░ PAGE TITLE ░░
     A <div>, not a <header>: a <header> would pick up the site's header
     bar from css/style.css. -->
<div class="page-head laser-head">
  <div class="container container--laser">
    <a class="lab__back reveal" href="?view=labs" data-goto="labs" data-ui="backToLabs"></a>
    <p class="eyebrow reveal" data-text="page.eyebrow"></p>
    <h1 class="page-head__title reveal" data-text="page.title"></h1>
    <p class="lead reveal" data-text="page.lead"></p>
    <!-- Opens the step-by-step introduction again (js/laser-intro.js; it
         opens by itself each time the page comes on screen). -->
    <button class="btn btn--ghost btn--sm laser-head__intro reveal" type="button" data-laser-intro data-text="intro.replay"></button>
  </div>
</div>

<!-- ░░ THE BENCH ░░
     Every canvas here is drawn by js/laser/ui/ (draw-bench.js, draw-plots.js,
     draw-photons.js, draw-stability.js). Their descriptions for screen readers
     (bench.alt, power.alt, ... in data/laser.json) are put on the canvases
     by js/laser/page.js, which also connects the dropdowns, sliders, number
     boxes, buttons and numbers below through their data-laser-* names: keep
     those names as they are. -->
<section class="band band--laser">
  <div class="container container--laser">
    <div class="laser-stage">

      <div class="laser-stage__bench laser-bench reveal">
        <!-- Above the drawing, centred over the drawn medium (the picture is
             symmetric): the gain medium's dropdown, filled in by
             js/laser/page.js (the names are media.* in data/laser.json, in
             the groups of choose.groups), and a link to that medium's
             section of the laser book (data-laser-more, set by page.js). -->
        <div class="laser-over">
          <div class="laser-choose__item laser-choose__item--bench">
            <label class="lab-control__name" for="laser-medium" data-text="choose.medium"></label>
            <select class="laser-choose__select" id="laser-medium" data-laser-choose="medium"></select>
            <a class="link laser-more" data-goto="laser-study" data-laser-more="medium" hidden><span data-ui="learnMore"></span></a>
          </div>
        </div>
        <!-- The drawing with a column at each end: on the left, beside the
             back mirror, and on the right, beside the output mirror, that
             mirror's shape (flat, concave or convex: the little pictures show
             its face as the bench draws it, with the laser on the side it
             faces) and, for a curved one, a vertical slider for its radius,
             which js/laser/page.js shows only then (data-laser-slider). On a
             narrow screen the two columns go under the drawing, side by side. -->
        <div class="laser-bench__row">
          <div class="laser-end laser-end--back">
            <div class="laser-mirror" data-laser-mirror="mirror1">
              <span class="lab-control__name" id="laser-mirror1-name" data-text="bench.parts.backMirror"></span>
              <div class="laser-shapes" role="group" aria-labelledby="laser-mirror1-name">
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="flat">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18"/></svg>
                  <span data-text="controls.shapes.flat"></span>
                </button>
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="concave">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3q-8 9 0 18"/></svg>
                  <span data-text="controls.shapes.concave"></span>
                </button>
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="convex">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 3q8 9 0 18"/></svg>
                  <span data-text="controls.shapes.convex"></span>
                </button>
              </div>
              <a class="link laser-more" data-goto="laser-study" data-route-id="more.mirrors"><span data-ui="learnMore"></span></a>
            </div>
            <div class="lab-control laser-end__radius" data-laser-slider="Rc1" hidden>
              <div class="lab-control__label">
                <span class="laser-end__r" aria-hidden="true">R</span>
                <label class="lab-control__name laser-end__label" for="laser-Rc1" id="laser-Rc1-name" data-text="controls.Rc1"></label>
                <span class="laser-field">
                  <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-Rc1-name" data-laser-input="Rc1">
                  <span class="laser-field__unit" data-laser-unit="Rc1"></span>
                </span>
              </div>
              <input class="lab-control__input" id="laser-Rc1" type="range" min="0" max="1000" step="1" data-laser-control="Rc1">
            </div>
          </div>
          <div class="laser-bench__view">
            <canvas class="laser-bench__canvas" data-laser-canvas="bench" role="img"></canvas>
          </div>
          <div class="laser-end laser-end--output">
            <div class="laser-mirror" data-laser-mirror="mirror2">
              <span class="lab-control__name" id="laser-mirror2-name" data-text="bench.parts.outputMirror"></span>
              <div class="laser-shapes" role="group" aria-labelledby="laser-mirror2-name">
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="flat">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18"/></svg>
                  <span data-text="controls.shapes.flat"></span>
                </button>
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="concave">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 3q8 9 0 18"/></svg>
                  <span data-text="controls.shapes.concave"></span>
                </button>
                <button class="laser-shape" type="button" aria-pressed="false" data-laser-shape="convex">
                  <svg class="laser-shape__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3q-8 9 0 18"/></svg>
                  <span data-text="controls.shapes.convex"></span>
                </button>
              </div>
              <a class="link laser-more" data-goto="laser-study" data-route-id="more.mirrors"><span data-ui="learnMore"></span></a>
            </div>
            <div class="lab-control laser-end__radius" data-laser-slider="Rc2" hidden>
              <div class="lab-control__label">
                <span class="laser-end__r" aria-hidden="true">R</span>
                <label class="lab-control__name laser-end__label" for="laser-Rc2" id="laser-Rc2-name" data-text="controls.Rc2"></label>
                <span class="laser-field">
                  <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-Rc2-name" data-laser-input="Rc2">
                  <span class="laser-field__unit" data-laser-unit="Rc2"></span>
                </span>
              </div>
              <input class="lab-control__input" id="laser-Rc2" type="range" min="0" max="1000" step="1" data-laser-control="Rc2">
            </div>
          </div>
        </div>
        <!-- Right under the laser, in the middle, under the drawn pump: the
             pump's dropdown (filled in by js/laser/page.js with the pumps the
             medium can use) with a link to that pump's section of the book,
             and under it Fire (shown only when the pump is a flashlamp). On
             the left, under the drawn filter, the Q-switch's name with its
             On/Off switch (only for a laser that can have one). Fire asks to
             be pressed while the lamp is dark (data-ready, set by page.js).
             Turning the switch on or off keeps the run and the chart going. -->
        <div class="laser-under" data-laser-under>
          <div class="laser-under__middle">
            <div class="laser-choose__item laser-choose__item--bench">
              <label class="lab-control__name" for="laser-pump-kind" data-text="choose.pump"></label>
              <select class="laser-choose__select" id="laser-pump-kind" data-laser-choose="pump"></select>
              <a class="link laser-more" data-goto="laser-study" data-laser-more="pump" hidden><span data-ui="learnMore"></span></a>
            </div>
            <button class="btn btn--primary laser-fire" type="button" data-laser-action="fire" data-ready="false" hidden>
              <svg class="laser-fire__bolt" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 2 4.5 13.5h6.2L9.5 22l10-12.5h-6.3z"/></svg>
              <span data-text="buttons.fire"></span>
            </button>
          </div>
          <div class="laser-switch" data-laser-switch hidden>
            <span class="laser-switch__name" id="laser-switch-name" data-text="choose.qSwitch"></span>
            <button class="laser-switch__toggle" type="button" role="switch" aria-checked="false" aria-labelledby="laser-switch-name" data-laser-action="qSwitch">
              <span class="laser-switch__track" aria-hidden="true"><span class="laser-switch__knob"></span></span>
              <span class="laser-switch__word" data-laser-name="qSwitchState"></span>
            </button>
            <a class="link laser-more" data-goto="laser-study" data-route-id="more.qSwitch"><span data-ui="learnMore"></span></a>
          </div>
          <!-- On the right, the doubling crystal (stage 13b; only for the
               1.06 µm lasers): in the beam past the output mirror, it turns
               some of the light green. -->
          <div class="laser-switch laser-switch--doubler" data-laser-doubler hidden>
            <span class="laser-switch__name" id="laser-doubler-name" data-text="choose.doubler"></span>
            <button class="laser-switch__toggle" type="button" role="switch" aria-checked="false" aria-labelledby="laser-doubler-name" data-laser-action="doubler">
              <span class="laser-switch__track" aria-hidden="true"><span class="laser-switch__knob"></span></span>
              <span class="laser-switch__word" data-laser-name="doublerState"></span>
            </button>
            <!-- Shown while the crystal is in and the Q-switch is off: a
                 steady beam turns almost nothing green. -->
            <a class="link laser-more" data-goto="laser-study" data-route-id="more.doubler"><span data-ui="learnMore"></span></a>
            <p class="laser-switch__note" data-laser-note="doubler" data-text="notes.doubler" hidden></p>
          </div>
        </div>
      </div>

      <!-- The controls. A slider and its number box show the same
           value; the pump slider's name, the units, the Play/Pause word
           and the line under the slow-motion slider are written by
           js/laser/page.js, which also shows the filter's slider only
           while the Q-switch is on (data-laser-slider). -->
      <div class="laser-stage__controls lab__panel reveal">
        <div class="lab__controls">
          <div class="lab-control">
            <div class="lab-control__label">
              <label class="lab-control__name" for="laser-pump" id="laser-pump-name" data-laser-name="pump"></label>
              <span class="laser-field">
                <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-pump-name" data-laser-input="pump">
                <span class="laser-field__unit" data-laser-unit="pump"></span>
              </span>
            </div>
            <input class="lab-control__input" id="laser-pump" type="range" min="0" max="1000" step="1" data-laser-control="pump">
          </div>
          <div class="lab-control">
            <div class="lab-control__label">
              <label class="lab-control__name" for="laser-coupler" id="laser-coupler-name" data-text="controls.coupler"></label>
              <span class="laser-field">
                <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-coupler-name" data-laser-input="coupler">
                <span class="laser-field__unit" data-laser-unit="coupler"></span>
              </span>
            </div>
            <input class="lab-control__input" id="laser-coupler" type="range" min="0" max="1000" step="1" data-laser-control="coupler">
            <p class="laser-more-row"><a class="link laser-more" data-goto="laser-study" data-route-id="more.coupler"><span data-ui="learnMore"></span></a></p>
          </div>
          <div class="lab-control" data-laser-slider="absorberT0" hidden>
            <div class="lab-control__label">
              <label class="lab-control__name" for="laser-absorberT0" id="laser-absorberT0-name" data-text="controls.absorberT0"></label>
              <span class="laser-field">
                <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-absorberT0-name" data-laser-input="absorberT0">
                <span class="laser-field__unit" data-laser-unit="absorberT0"></span>
              </span>
            </div>
            <input class="lab-control__input" id="laser-absorberT0" type="range" min="0" max="1000" step="1" data-laser-control="absorberT0">
          </div>
          <div class="lab-control">
            <div class="lab-control__label">
              <label class="lab-control__name" for="laser-slowMotion" id="laser-slowMotion-name" data-text="controls.slowMotion"></label>
              <span class="laser-field">
                <input class="laser-field__input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="laser-slowMotion-name" data-laser-input="slowMotion">
                <span class="laser-field__unit" data-laser-unit="slowMotion"></span>
              </span>
            </div>
            <input class="lab-control__input" id="laser-slowMotion" type="range" min="0" max="1000" step="1" data-laser-control="slowMotion">
            <p class="laser-hint" data-laser-value="slowMotion"></p>
          </div>
        </div>
        <div class="lab__buttons">
          <button class="btn btn--ghost btn--sm" type="button" data-laser-action="play"></button>
          <button class="btn btn--ghost btn--sm" type="button" data-laser-action="reset" data-ui="labReset"></button>
        </div>
        <p class="laser-note" data-laser-note="behind" data-text="notes.behind" hidden></p>
      </div>

      <!-- The big chart, the mirrors' stability diagram (stage 10b: beside
           the bench on a wide screen, to watch while the laser runs) and
           the numbers. -->
      <div class="laser-stage__side">
        <div class="laser-side__chart laser-bench reveal">
          <canvas class="laser-bench__canvas laser-bench__canvas--chart" data-laser-canvas="power" role="img"></canvas>
          <p class="laser-more-row"><a class="link laser-more" data-goto="laser-study" data-route-id="more.chart"><span data-ui="learnMore"></span></a></p>
        </div>
        <div class="laser-side__stability laser-bench reveal">
          <canvas class="laser-bench__canvas" data-laser-canvas="stability" role="img"></canvas>
          <p class="laser-more-row"><a class="link laser-more" data-goto="laser-study" data-route-id="more.stability"><span data-ui="learnMore"></span></a></p>
        </div>
        <div class="laser-side__numbers lab__panel reveal">
          <!-- One row per number. Each pump shows some of them; js/laser/page.js
               hides the others (data-laser-row). -->
          <div class="lab__readouts laser-readouts">
            <div class="lab-readout" data-laser-row="pumpThreshold">
              <span class="lab-readout__label" data-text="readouts.pumpThreshold"></span>
              <span class="lab-readout__value" data-laser-readout="pumpThreshold">—</span>
            </div>
            <div class="lab-readout" data-laser-row="currentThreshold">
              <span class="lab-readout__label" data-text="readouts.currentThreshold"></span>
              <span class="lab-readout__value" data-laser-readout="currentThreshold">—</span>
            </div>
            <div class="lab-readout" data-laser-row="flashThreshold">
              <span class="lab-readout__label" data-text="readouts.flashThreshold"></span>
              <span class="lab-readout__value" data-laser-readout="flashThreshold">—</span>
            </div>
            <div class="lab-readout" data-laser-row="x">
              <span class="lab-readout__label" data-text="readouts.x"></span>
              <span class="lab-readout__value" data-laser-readout="x">—</span>
            </div>
            <div class="lab-readout" data-laser-row="gth">
              <span class="lab-readout__label" data-text="readouts.gth"></span>
              <span class="lab-readout__value" data-laser-readout="gth">—</span>
            </div>
            <div class="lab-readout" data-laser-row="tau_c">
              <span class="lab-readout__label" data-text="readouts.tau_c"></span>
              <span class="lab-readout__value" data-laser-readout="tau_c">—</span>
            </div>
            <div class="lab-readout" data-laser-row="stability">
              <span class="lab-readout__label" data-text="readouts.stability"></span>
              <span class="lab-readout__value" data-laser-readout="stability">—</span>
            </div>
            <div class="lab-readout" data-laser-row="waist">
              <span class="lab-readout__label" data-text="readouts.waist"></span>
              <span class="lab-readout__value" data-laser-readout="waist">—</span>
            </div>
            <div class="lab-readout" data-laser-row="mirrorLoss">
              <span class="lab-readout__label" data-text="readouts.mirrorLoss"></span>
              <span class="lab-readout__value" data-laser-readout="mirrorLoss">—</span>
            </div>
            <div class="lab-readout" data-laser-row="thermalLens">
              <span class="lab-readout__label" data-text="readouts.thermalLens"></span>
              <span class="lab-readout__value" data-laser-readout="thermalLens">—</span>
            </div>
            <div class="lab-readout" data-laser-row="lossNow">
              <span class="lab-readout__label" data-text="readouts.lossNow"></span>
              <span class="lab-readout__value" data-laser-readout="lossNow">—</span>
            </div>
            <div class="lab-readout" data-laser-row="P_out">
              <span class="lab-readout__label" data-text="readouts.P_out"></span>
              <span class="lab-readout__value" data-laser-readout="P_out">—</span>
            </div>
            <div class="lab-readout" data-laser-row="giant">
              <span class="lab-readout__label" data-text="readouts.giant"></span>
              <span class="lab-readout__value" data-laser-readout="giant">—</span>
            </div>
            <!-- Its name is written by js/laser/page.js: since the flash, or
                 since the start on a laser with a steady pump. -->
            <div class="lab-readout" data-laser-row="peak">
              <span class="lab-readout__label" data-text="readouts.peak" data-laser-name="peak"></span>
              <span class="lab-readout__value" data-laser-readout="peak">—</span>
            </div>
            <div class="lab-readout" data-laser-row="powerNow">
              <span class="lab-readout__label" data-text="readouts.powerNow"></span>
              <span class="lab-readout__value" data-laser-readout="powerNow">—</span>
            </div>
            <div class="lab-readout" data-laser-row="harmonic">
              <span class="lab-readout__label" data-text="readouts.harmonic"></span>
              <span class="lab-readout__value" data-laser-readout="harmonic">—</span>
            </div>
            <div class="lab-readout" data-laser-row="T_best">
              <span class="lab-readout__label" data-text="readouts.T_best"></span>
              <span class="lab-readout__value" data-laser-readout="T_best">—</span>
            </div>
            <div class="lab-readout" data-laser-row="period">
              <span class="lab-readout__label" data-text="readouts.period"></span>
              <span class="lab-readout__value" data-laser-readout="period">—</span>
            </div>
            <div class="lab-readout" data-laser-row="time">
              <span class="lab-readout__label" data-text="readouts.time"></span>
              <span class="lab-readout__value" data-laser-readout="time">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Inside the medium: the cartoon of atoms and photons, and under it
           the energy levels of one of its atoms. -->
      <div class="laser-stage__photons">
        <div class="laser-bench reveal">
          <canvas class="laser-bench__canvas" data-laser-canvas="photons" role="img"></canvas>
          <p class="laser-more-row"><a class="link laser-more" data-goto="laser-study" data-route-id="more.photons"><span data-ui="learnMore"></span></a></p>
        </div>
        <div class="laser-bench reveal">
          <canvas class="laser-bench__canvas" data-laser-canvas="atoms" role="img"></canvas>
          <p class="laser-more-row"><a class="link laser-more" data-goto="laser-study" data-route-id="more.atoms"><span data-ui="learnMore"></span></a></p>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ░░ THE THEORY ░░
     It has a page of its own, the study page (?view=laser-study, words in
     data/laser-study.json); this last section only points there. -->
<section class="band laser-learn">
  <div class="container container--narrow">
    <h2 class="section-title reveal" data-text="learn.title"></h2>
    <p class="lead reveal" data-text="learn.lead"></p>
    <p class="laser-learn__go reveal">
      <a class="btn btn--ghost" data-route="learn.route" data-text="learn.link"></a>
    </p>
  </div>
</section>

</div><!-- /.laser-lab -->
