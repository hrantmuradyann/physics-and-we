<!--
  ══════════════════════════════════════════════════════════════════════════
  THE LASER BOOK (?view=laser-study) — layout only.
  The words are NOT here. They are in  data/laser-study.json .
  The book has chapters, each with sections. Every section is the easy
  version; its "More simply" box (a <details>, it opens and closes by itself)
  tells it again in everyday words, and its "Dig deeper" box holds the full
  version with the maths. A section without "simpler" or "deeper" has no
  such box, and one without "picture" has no picture.
  js/laser-study.js writes the numbers (3, 3.1) into [data-study-number],
  so chapters and sections can be moved in the JSON freely.
  Formulas in the JSON are LaTeX between $ … $, typeset by js/laser-study.js.
  ══════════════════════════════════════════════════════════════════════════
-->

<!-- ░░ PAGE TITLE, AND THE WAY TO THE SIMULATOR ░░ -->
<header class="page-head">
  <div class="container container--narrow">
    <p class="eyebrow reveal" data-text="head.eyebrow"></p>
    <h1 class="page-head__title reveal" data-text="head.title"></h1>
    <p class="lead reveal" data-text="head.lead"></p>
    <p class="study__go reveal">
      <a class="btn btn--primary" data-route="simulator.route" data-text="simulator.label"></a>
    </p>
  </div>
</header>

<!-- ░░ HIDE LINKS: a button pinned to the screen's corner while the book
     scrolls (css/site.css .study-links); js/laser-study.js turns the text's
     links into plain words and back, and shows the matching word. ░░ -->
<button type="button" class="btn btn--ghost study-links" data-study-links aria-pressed="false">
  <span data-ui="hideLinks" data-study-links-hide></span>
  <span data-ui="showLinks" data-study-links-show hidden></span>
</button>

<section class="band">
  <div class="container container--narrow study-book">

    <!-- ░░ THE CONTENTS: each chapter, and its sections under it ░░ -->
    <nav class="study-toc" data-study-toc>
      <h2 class="section-title" data-text="contents"></h2>
      <ol class="study-toc__list" role="list" data-list="chapters">
        <template>
          <li class="study-toc__chapter" data-study-toc-chapter>
            <a class="link study-toc__link" data-study-link><span class="study-num" data-study-number></span> <span data-text="title"></span></a>
            <ol class="study-toc__sections" role="list" data-list="sections">
              <template>
                <li><a class="link" data-study-link><span class="study-num" data-study-number></span> <span data-text="title"></span></a></li>
              </template>
            </ol>
          </li>
        </template>
      </ol>
    </nav>

    <!-- ░░ THE CHAPTERS ░░ -->
    <div class="study__chapters" data-list="chapters">
      <template>
        <article class="study-chapter" data-study-chapter>
          <!-- The chapter's title, and at its right the button that shows
               this one chapter in Russian and back (js/laser-study.js writes
               its word: "Русский", or the site's language). -->
          <div class="study-chapter__head">
            <h2 class="section-title study-chapter__title"><span class="study-num" data-study-number></span> <span data-text="title"></span></h2>
            <button type="button" class="btn btn--ghost study-chapter__lang" data-study-russian></button>
          </div>
          <div class="prose study-chapter__intro" data-rich="intro"></div>

          <div class="study-chapter__sections" data-list="sections">
            <template>
              <section class="study-section" data-study-section>
                <h3 class="study-section__title"><span class="study-num" data-study-number></span> <span data-text="title"></span></h3>
                <div class="prose" data-rich="text"></div>

                <!-- A picture: shown when "image" names a file, else a box
                     saying what the picture should show ("todo"). -->
                <figure class="study-figure" data-study-figure>
                  <img class="study-figure__image" loading="lazy" data-study-image data-image="picture.image" data-alt="picture.alt">
                  <!-- More pictures under the first, one caption for all
                       ("more" in the JSON: the five laser classes' labels). -->
                  <div class="study-figure__more" data-list="picture.more">
                    <template>
                      <img class="study-figure__image" loading="lazy" data-image="image" data-alt="alt">
                    </template>
                  </div>
                  <figcaption class="study-figure__caption" data-study-caption data-text="picture.caption"></figcaption>
                  <p class="study-figure__todo" data-study-todo><strong data-ui="pictureToCome"></strong> <span data-study-todo-text data-text="picture.todo"></span></p>
                </figure>

                <!-- Two buttons in one row: "More simply" (the section again
                     in everyday words) and "Dig deeper" (the maths). The one
                     opened takes the whole width under them. -->
                <div class="study-more">
                  <details class="study-deeper study-deeper--simpler" data-study-simpler>
                    <summary class="btn btn--ghost"><span data-ui="moreSimply"></span></summary>
                    <div class="study-deeper__body">
                      <div class="prose" data-rich="simpler.text"></div>
                    </div>
                  </details>
                  <details class="study-deeper" data-study-deeper>
                    <summary class="btn btn--ghost"><span data-ui="digDeeper"></span></summary>
                    <div class="study-deeper__body">
                      <h4 class="study-deeper__title" data-text="deeper.title"></h4>
                      <div class="prose" data-rich="deeper.text"></div>
                    </div>
                  </details>
                </div>
              </section>
            </template>
          </div>

          <p class="study-chapter__top"><a class="link" data-study-top><span data-ui="toContents"></span> ↑</a></p>
        </article>
      </template>
    </div>

    <!-- ░░ SOURCES ░░ -->
    <div class="study__sources">
      <h2 class="section-title" data-text="sources.title"></h2>
      <div class="prose" data-rich="sources.text"></div>
    </div>
  </div>
</section>
