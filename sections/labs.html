<!--
  ══════════════════════════════════════════════════════════════════════════
  INTERACTIVE LABS PAGE — layout only.

  The words are NOT here. They are in  data/labs.json .

  The list of labs is "simulations": the interactive ones that run in the
  browser. Each card opens its own page at  ?view=lab&id=<slug> .

  To add or remove a lab you do NOT touch this file — you copy a block
  inside data/labs.json. A new lab also needs its two files,
  js/labs/<slug>.js and data/labs/<slug>.json — see Instructions/LABS-GUIDE.md.
  ══════════════════════════════════════════════════════════════════════════
-->

<!-- Silver lines behind the whole page — see .line-art in css/labs.css -->
<div class="line-art">

<!-- ░░ PAGE TITLE ░░ -->
<header class="page-head">
  <div class="container">
    <p class="eyebrow reveal" data-text="page.eyebrow"></p>
    <h1 class="page-head__title reveal" data-text="page.title"></h1>
    <p class="lead reveal" data-text="page.lead"></p>
  </div>
</header>

<!-- ░░ THE SIMULATIONS THAT RUN IN THE BROWSER ░░
     Each card opens  ?view=lab&id=<slug> .  The page it goes to is written
     here in the layout (data-goto="lab"); only the name of the lab comes
     from the JSON (data-route-id="slug"). A lab with no slug is dropped.  -->
<section class="band">
  <div class="container">
    <p class="eyebrow reveal" data-text="simulations.eyebrow"></p>
    <h2 class="section-title reveal" data-text="simulations.title"></h2>
    <p class="lead lab-intro reveal" data-text="simulations.lead"></p>

    <div class="grid grid--cards" data-list="simulations.items">
      <template>
        <a class="card card--link reveal" href="?view=lab" data-goto="lab" data-route-id="slug">
          <span class="card__icon" data-icon="icon"></span>
          <h3 class="card__title" data-text="title"></h3>
          <p class="card__text" data-text="text"></p>
          <p class="card__meta" data-text="meta"></p>
          <span class="card__arrow">
            <span data-ui="openLab"></span>
          </span>
        </a>
      </template>
    </div>
  </div>
</section>

<!-- ░░ A PHOTOGRAPH ░░ -->
<section class="photo-band">
  <div class="container">
    <figure class="photo reveal">
      <img data-image="photo.image" data-alt="photo.alt" loading="lazy" decoding="async">
    </figure>
  </div>
</section>

</div><!-- /.line-art -->
