<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════════════
   Physics and We — the website
  ══════════════════════════════════════════════════════════════════════════════

   THERE IS NO PAGE CONTENT IN THIS FILE. Nothing to edit here for normal work.
   This file only loads the design (css) and the scripts (js).

   WHERE DO I CHANGE ...                        OPEN THIS FILE
   ----------------------------------------------------------------------------
   any text, in any language                    data/<page>.json
   the menu, the footer, the site name          data/site.json
   a news item                                  the admin page at /admin/
   the order of the blocks on a page            sections/<page>.html
   the words of an interactive lab              data/labs/<lab>.json
   colours (dark and light theme)               css/style.css
   sizes, spacing, the look of the blocks       css/site.css
   ----------------------------------------------------------------------------

   Full instructions, in plain words:  Instructions/EDITING-GUIDE.md
  ══════════════════════════════════════════════════════════════════════════════
-->
<html lang="hy" class="site">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics and We</title>
  <meta name="description" content="Physics and We — interactive labs, a summer camp and student research.">

  <link rel="icon" href="images/logo-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="images/logo-mark.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/labs.css">

  <!-- Dark or light theme. Loaded here, before the page is drawn, so a
       visitor who chose the light theme never sees a flash of dark. -->
  <script src="js/theme.js"></script>
</head>

<body class="site home">
  <!-- The menu is built from data/site.json by js/main.js -->
  <header id="site-header"></header>

  <!-- Each page of the site is loaded into here from the sections folder -->
  <main id="app"></main>

  <!-- The footer is built from data/site.json by js/main.js -->
  <footer id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script src="js/router.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/home.js"></script>
  <script src="js/news.js"></script>

  <!-- The interactive labs. labs.js is the shell every lab runs inside;
       each file under js/labs/ is one lab and registers itself with it.
       To add a lab, add one line here. See Instructions/LABS-GUIDE.md. -->
  <script src="js/labs.js"></script>
  <script src="js/labs/pendulum.js"></script>
  <script src="js/labs/refraction.js"></script>
</body>
</html>
